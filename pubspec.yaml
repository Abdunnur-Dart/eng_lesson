name: "arabic"
description: "арабские буквы"
publish_to: 'none'
version: 1.0.0+111

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  webview_flutter: ^4.10.0
  url_launcher: ^6.2.6
  app_links: ^7.2.1
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.16.0
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  firebase_analytics: ^10.10.7

# Принудительно фиксируем версию фоновой библиотеки, не требующей compileSdk 36
dependency_overrides:
  package_info_plus: 8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1" 
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/letters_data.json

  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
#        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon.png"