name: checkers_game
description: Игра Шашки на Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.2.6
  app_links: ^7.2.1
  cloud_firestore: ^4.17.5
  firebase_auth: ^4.16.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: "^0.13.1" 
  change_app_package_name: "^1.1.0"

flutter:
  uses-material-design: true
  assets:
    - assets/letters_data.json
flutter_launcher_icons:
  image_path: "assets/icon.png" # Путь к вашей исходной картинке (желательно 1024x1024 px)
  android: true
  
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700

